<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprimir PDF gratis y sin subir archivos | ConfidentialPDF</title>
  <meta name="description" content="Reduce el tamaño de tu PDF gratis. Tus archivos nunca se suben a ningún servidor. Todo ocurre en tu navegador.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; }
    header { padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e2130; }
    .logo { font-size: 1.1rem; font-weight: 600; color: #fff; text-decoration: none; }
    .logo span { color: #4f8ef7; }
    .badge { font-size: 12px; background: #1a2a1a; color: #4caf80; border: 1px solid #2a4a2a; padding: 4px 12px; border-radius: 20px; }
    .hero { text-align: center; padding: 3rem 2rem 2rem; }
    .hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
    .hero h1 span { color: #4f8ef7; }
    .hero p { color: #8890a8; font-size: 1rem; max-width: 480px; margin: 0 auto; line-height: 1.6; }
    .tool-box { max-width: 680px; margin: 2rem auto; padding: 0 1.5rem 4rem; }
    .drop-zone { border: 2px dashed #2a3050; border-radius: 16px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: #1a1f30; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #4f8ef7; background: #1a2040; }
    .drop-icon { font-size: 3rem; margin-bottom: 1rem; }
    .drop-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; }
    .drop-sub { font-size: 0.9rem; color: #8890a8; margin-bottom: 1.5rem; }
    .btn-select { background: #4f8ef7; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-select:hover { background: #3a7de8; }
    #file-input { display: none; }
    .file-selected { margin-top: 1.5rem; background: #1a1f30; border: 1px solid #2a3050; border-radius: 10px; padding: 1rem 1.25rem; display: none; align-items: center; gap: 12px; }
    .file-selected.visible { display: flex; }
    .file-icon { font-size: 2rem; }
    .file-info { flex: 1; }
    .file-name { font-size: 14px; font-weight: 500; color: #e8eaf0; }
    .file-size { font-size: 12px; color: #8890a8; margin-top: 2px; }
    .file-remove { background: none; border: none; color: #8890a8; cursor: pointer; font-size: 18px; }
    .quality-box { margin-top: 1.5rem; background: #1a1f30; border: 1px solid #2a3050; border-radius: 10px; padding: 1.25rem; display: none; }
    .quality-box.visible { display: block; }
    .quality-label { font-size: 13px; color: #8890a8; margin-bottom: 12px; }
    .quality-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .quality-opt { background: #0f1117; border: 1px solid #2a3050; border-radius: 8px; padding: 0.75rem; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .quality-opt:hover { border-color: #4f8ef7; }
    .quality-opt.selected { border-color: #4f8ef7; background: #1a2040; }
